<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>喵呜小屋·像素猫咪</title><style>*{box-sizing:border-box}body{margin:0;background:#f2e7d8;color:#382f4e;font:14px sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}header>b{font-size:25px}header span,.level{background:#fff9e9;border:2px solid #382f4e;padding:10px;box-shadow:3px 3px #382f4e}main{display:grid;grid-template-columns:1fr 300px;gap:18px}.side{display:flex;flex-direction:column;gap:12px}.card{background:#fff9e9;border:3px solid #382f4e;padding:16px;box-shadow:6px 6px #382f4e}.label{font-size:11px;font-weight:bold;margin-bottom:12px}.label small{float:right;color:#998b9a}.room{position:relative;border:3px solid #382f4e;background:#bfe7e8}.room canvas{display:block;width:100%;height:auto;image-rendering:pixelated;cursor:pointer}.roomtag{position:absolute;top:8px;left:8px;background:#fff9e9;border:2px solid #382f4e;padding:5px;font-size:8px}.bubble{position:absolute;top:14%;left:50%;transform:translateX(-50%);background:white;border:2px solid #382f4e;padding:7px 10px;white-space:nowrap}.hint{position:absolute;bottom:8px;right:8px;background:#fff9;padding:4px;font-size:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stats>div{background:white;border:2px solid #e9dacd;padding:8px;font-size:11px;font-weight:bold}.stats b{float:right}.bar{height:11px;border:2px solid #382f4e;margin-top:6px;background:#eee}.bar i{display:block;height:100%;width:70%;background:#f2bd57}.stats>div:nth-child(2) .bar i{background:#fa8ca5}.stats>div:nth-child(3) .bar i{background:#8acbea}.stats small{display:block;color:#998b9a;font-size:9px;margin-top:4px}.name{display:flex;justify-content:space-between;align-items:center;border-bottom:2px dashed #e9dacd;padding-bottom:9px}.name h1{margin:2px 0;font-size:24px}.name small{color:#998b9a}h2{font-size:17px;margin:15px 0 8px}p{font-size:10px;color:#95899a;margin:5px 0 9px}.foods{display:grid;gap:7px}.food{display:grid;grid-template-columns:35px 1fr auto;align-items:center;gap:7px;background:white;border:2px solid #e9dacd;padding:7px;cursor:pointer;text-align:left}.food:hover{border-color:#fa8ca5}.food .icon{font-size:21px;background:#fff2df;padding:5px}.food strong{font-size:11px}.food small{display:block;color:#998b9a;font-size:9px}.food em{font-style:normal;font-size:10px;color:#a47a2b}
hr{border:0;border-top:2px dashed #e9dacd;margin:13px 0}.btn{width:100%;padding:10px;border:2px solid #382f4e;background:#ffd66b;box-shadow:3px 3px #382f4e;font-weight:bold;cursor:pointer}.pink{background:#fa8ca5}.mint{background:#a6e6c2}.book{font-size:10px;display:flex;justify-content:space-between}.book button{border:0;background:none;text-decoration:underline;color:#725b94;cursor:pointer}footer{text-align:center;color:#998d99;font-size:10px;margin:20px}.shade{display:none;position:fixed;inset:0;background:#201938c9;place-items:center;padding:15px;z-index:4}.shade.show{display:grid}.modal{width:min(540px,100%);background:#fff9e9;border:4px solid #382f4e;box-shadow:7px 7px #171324;padding:15px}.modal header{font-size:20px;font-weight:bold}.modal header button{background:#fa8ca5;border:2px solid #382f4e;font-size:18px;cursor:pointer}.field{height:250px;background:#bfe7e8;border:3px solid #382f4e;position:relative;overflow:hidden;cursor:crosshair}.intro{position:absolute;inset:0;background:#fffd;display:grid;place-content:center;text-align:center;gap:9px;font-weight:bold;z-index:1}.intro small{font-weight:normal;line-height:1.7}.fish{position:absolute;font-size:30px;transform:translate(-50%,-50%);cursor:pointer}.hud{text-align:center;font-size:12px}.collection{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kitty{background:white;border:2px solid #e9dacd;padding:10px 4px;text-align:center;cursor:pointer}.kitty b{display:block;font-size:24px}.kitty.active{border-color:#fa8ca5}@media(max-width:760px){.wrap{padding:12px}main{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.name,.foodarea,.book,.rule{grid-column:1/-1}}@media(max-width:450px){.stats{grid-template-columns:1fr}.side{grid-template-columns:1fr}.name,.foodarea,.book,.rule{grid-column:auto}.day{display:none}}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#382f4e;color:white;padding:11px 16px;border:2px solid white;box-shadow:3px 3px #171324;transition:.2s;z-index:9;font-size:12px}#toast.show{opacity:1;transform:translate(-50%,0)}</style></head><body><div class="wrap"><header><b>🐾 喵呜小屋</b><span>🌤 第 <i id="day">1</i> 天　🪙 <strong id="coins">30</strong></span></header><main><section class="card"><div class="label">// MY LITTLE CAT <small>点小猫摸摸它</small></div><div class="room"><canvas id="scene" width="240" height="144"></canvas><span class="roomtag">ROOM 01 · SUNNY DAY</span><div class="bubble" id="bubble">喵～你好呀！</div><span class="hint">点击猫咪试试看</span></div><div class="stats"><div>🍚 饱腹 <b id="hn">72</b><div class="bar"><i id="hb"></i></div><small id="ht"></small></div><div>💗 心情 <b id="jn">68</b><div class="bar"><i id="jb"></i></div><small id="jt"></small></div><div>⚡ 精神 <b id="en">80</b><div class="bar"><i id="eb"></i></div><small>陪玩会消耗一点</small></div></div></section><aside class="card side"><div class="name"><div><small>你的新朋友</small><h1 id="catname">奶糖</h1></div><span class="level">LV.<b id="level">1</b></span></div><div><h2>🥣 喂点好吃的</h2><div id="foods" class="foods"></div></div><hr><div><h2>🐟 大鱼吃小鱼</h2><p>抓住小鱼赚金币，给猫猫买零食！</p><button id="play" class="btn pink">开始小游戏 →</button></div><div><h2>🤲 摸摸小猫</h2><p>多陪陪奶糖，心情会变好哦。</p><button id="pet" class="btn mint">摸摸奶糖 ♡</button></div><hr><div class="book">📖 猫咪收藏册 <button id="openCats">看看其他猫咪 →</button></div></aside></main><footer>♡ 多陪陪小猫，它会成为你最亲密的伙伴 ♡</footer></div><div id="toast"></div>
<div class="shade" id="gameModal"><section class="modal"><header>🐟 大鱼吃小鱼 <button data-close="gameModal">×</button></header><div class="field" id="field"><div class="intro" id="intro">准备好抓鱼了吗？<small>20 秒内尽量多抓几条<br>每条鱼可得 3 金币！</small><button id="go" class="btn">开始抓鱼</button></div></div><p class="hud">剩余 <b id="timer">20</b> 秒　🐟 <b id="score">0</b> 条　+<b id="earned">0</b> 金币</p><button data-close="gameModal" class="btn mint">收下战利品</button></section></div>
<div class="shade" id="catsModal"><section class="modal"><header>📖 猫咪收藏册 <button data-close="catsModal">×</button></header><p>选一位新伙伴来陪你玩！</p><div id="collection" class="collection"></div></section></div>

<script>
const cats=[['奶糖','#df9351','喵～你好呀！'],['团子','#565168','我是一颗黑团子…'],['桃酥','#d66e4d','今天也要开心喵！'],['雪饼','#c3b8bd','呼噜呼噜～']];const food=[['🥣','香香猫粮',0,22,0],['🐟','鲜鱼罐罐',8,38,0],['🍰','猫咪小蛋糕',12,18,18]];let s={coins:30,h:72,j:68,e:80,l:1,cat:0,feed:0},score=0,timer=null,spawner=null,left=20,playing=false;const $=x=>document.querySelector(x),clamp=x=>Math.max(0,Math.min(100,x));
try{Object.assign(s,JSON.parse(localStorage.getItem("miaowSave")||"{}"))}catch(e){}function render(){for(let k of ['h','j','e']){$('#'+k+'n').textContent=s[k];$('#'+k+'b').style.width=s[k]+'%'}$('#coins').textContent=s.coins;$('#level').textContent=s.l;$('#ht').textContent=s.h<25?'肚肚饿扁啦！':'肚肚还不错';$('#jt').textContent=s.j<30?'有点不开心…':'心情超棒！'}function toast(x){let t=$('#toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}function say(x){$('#bubble').textContent=x}
$('#foods').innerHTML=food.map((f,i)=>`<button class="food" data-food="${i}"><span class="icon">${f[0]}</span><span><strong>${f[1]}</strong><small>饱腹 +${f[3]} ${f[4]?'· 心情 +'+f[4]:''}</small></span><em>${f[2]?'🪙 '+f[2]:'免费'}</em></button>`).join('');$('#foods').onclick=e=>{let b=e.target.closest('[data-food]');if(!b)return;let f=food[+b.dataset.food];if(s.coins<f[2])return toast('金币不够，玩游戏赚一点吧！');if(s.h>=100)return say('我已经饱饱的啦！');s.coins-=f[2];s.h=clamp(s.h+f[3]);s.j=clamp(s.j+f[4]+5);s.e=clamp(s.e+3);render();say('咕噜咕噜…好吃！');toast(f[0]+' 奶糖吃得好开心！');if(++s.feed%5===0){s.l++;render();toast('🎉 奶糖升级啦！')}};
function pet(){s.j=clamp(s.j+8);s.e=clamp(s.e-1);render();say(['呼噜呼噜～','这里再挠挠！','最喜欢你啦！'][Math.random()*3|0])}$('#pet').onclick=pet;
const c=$('#scene'),x=c.getContext('2d');function box(a,b,w,h,col){x.fillStyle=col;x.fillRect(a,b,w,h)}function draw(){box(0,0,240,104,'#c8eff0');box(0,104,240,40,'#dfa97f');for(let a=0;a<240;a+=24)box(a,104,1,40,'#c78868');box(9,14,57,48,'#6c5674');box(13,18,49,39,'#a4d8df');box(34,18,4,39,'#6c5674');box(65,119,110,17,'#ee9aaa');box(15,82,43,8,'#a97962');box(23,90,5,24,'#865c56');box(48,90,5,24,'#865c56');box(204,88,24,4,'#8e5d63');box(207,92,18,16,'#cf816d');box(211,75,5,14,'#609c79');box(199,77,12,5,'#74b887');box(218,71,8,5,'#78bf8a');catSprite();requestAnimationFrame(draw)}
function catSprite(){let col=cats[s.cat][1],bob=Math.sin(Date.now()/700)|0;box(143,87,8,5,col);box(149,81,5,8,col);box(152,76,4,7,col);box(89,54+bob,13,16,col);box(123,54+bob,13,16,col);box(93,59+bob,5,7,'#f6a9af');box(127,59+bob,5,7,'#f6a9af');box(85,66+bob,52,35,col);box(77,89+bob,68,29,col);box(81,111+bob,20,8,'#fff0dc');box(118,111+bob,21,8,'#fff0dc');box(94,83+bob,11,8,'#fff0dc');box(119,83+bob,11,8,'#fff0dc');box(108,84+bob,7,4,'#ef8799');box(97,75+bob,4,6,'#342a3d');box(123,75+bob,4,6,'#342a3d');if(s.cat===0||s.cat===2){box(104,66+bob,4,8,'#fff0dc');box(114,66+bob,4,8,'#fff0dc')}box(82,89+bob,12,1,'#584959');box(130,89+bob,12,1,'#584959')};draw();
$('#scene').onclick=pet;$('#openCats').onclick=()=>{$('#collection').innerHTML=cats.map((a,i)=>`<button class="kitty ${i===s.cat?'active':''}" data-cat="${i}"><b>${a[0]==='奶糖'?'🐈':i===1?'🐈‍⬛':'🐈'}</b>${a[0]}</button>`).join('');$('#catsModal').classList.add('show')};$('#collection').onclick=e=>{let b=e.target.closest('[data-cat]');if(!b)return;s.cat=+b.dataset.cat;$('#catname').textContent=cats[s.cat][0];$('#catsModal').classList.remove('show');say(cats[s.cat][2]);toast('欢迎新朋友来到喵呜小屋！')};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).classList.remove('show'));document.querySelectorAll('.shade').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('show')});function gameIntro(msg){$('#intro').style.display='grid';$('#intro').innerHTML=msg}
function spawn(){if(!playing)return;let f=document.createElement('span');f.className='fish';f.textContent=['🐟','🐠','🐡'][Math.random()*3|0];f.style.left=(8+Math.random()*84)+'%';f.style.top=(12+Math.random()*76)+'%';$('#field').append(f);f.onclick=()=>{if(!playing)return;score++;$('#score').textContent=score;f.remove()};setTimeout(()=>f.remove(),1300)}
function finish(){if(!playing)return;playing=false;clearInterval(timer);clearInterval(spawner);$('#field').querySelectorAll('.fish').forEach(f=>f.remove());s.coins+=score*3;s.j=clamp(s.j+Math.min(20,score*2));s.e=clamp(s.e-Math.min(15,score));render();$('#earned').textContent=score*3;gameIntro(`${score?'太棒啦，抓到 '+score+' 条小鱼！':'再试一次吧！'}<small>获得 ${score*3} 金币，奶糖替你开心！</small><button class="btn" id="again">再玩一次</button>`);$('#again').onclick=startGame}
function startGame(){if(playing)return;playing=true;score=0;left=20;$('#score').textContent=0;$('#timer').textContent=20;$('#earned').textContent=0;$('#intro').style.display='none';spawner=setInterval(spawn,650);spawn();timer=setInterval(()=>{left--;$('#timer').textContent=left;if(left<=0)finish()},1000)}function openGame(){score=0;left=20;$('#score').textContent=0;$('#timer').textContent=20;gameIntro('准备好抓鱼了吗？<small>20 秒内尽量多抓几条<br>每条鱼可得 3 金币！</small><button id="go" class="btn">开始抓鱼</button>');$('#go').onclick=startGame;$('#gameModal').classList.add('show')}$('#play').onclick=openGame;
setInterval(()=>{s.h=clamp(s.h-1);if(s.h<25)s.j=clamp(s.j-1);render()},60000);render();
</script></body></html>
